[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wslazy"
version = "0.1.0"
description = "Manage WSL processes, applications, ports, services, and command history in the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Environment :: Console :: Curses", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
wslazy = "wslazy.__main__:main"

[tool.setuptools]
packages = ["wslazy"]
